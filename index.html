<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المهام اليومية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Changa:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg-gradient-start:#f0faf0;--bg-gradient-end:#e8f5e8;--card-bg:#c8f5d8;--accent-purple:#5b2d8e;--accent-green-dark:#2d5a3d;--text-dark:#1a1a2e;--text-muted:#4a4a6a;--shadow-card:0 6px 30px rgba(91,45,142,0.1);--progress-bg:rgba(91,45,142,0.12)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,var(--bg-gradient-start),#f5fef5,var(--bg-gradient-end));height:100vh;color:var(--text-dark);overflow:hidden}
        .container{display:grid;grid-template-columns:1fr 2.2fr;height:100vh}
        .left-panel{display:flex;flex-direction:column;padding:2vh 2vw;padding-bottom:7vh;background:linear-gradient(180deg,#e8f8e8,#d4ecd4,#c8e0c8);position:relative;overflow:hidden}
        .logo-area{position:absolute;top:2vh;right:1.5vw;width:clamp(100px,8vw,180px);height:clamp(100px,8vw,180px);background:#c0392b;border-radius:22px 22px 0 22px;display:flex;align-items:center;justify-content:center;color:white;font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1rem,1.6vw,2rem);text-align:center;line-height:1.4;box-shadow:0 8px 30px rgba(192,57,43,0.4)}
        .conn-status{position:fixed;top:2vh;left:2vw;display:flex;align-items:center;gap:0.6rem;padding:0.6rem 1.4rem;border-radius:50px;font-size:clamp(1rem,1.2vw,1.5rem);font-weight:600;z-index:100}
        .conn-status.on{background:rgba(52,211,153,0.15);color:#059669;border:1px solid rgba(52,211,153,0.3)}
        .conn-status.off{background:rgba(239,68,68,0.15);color:#dc2626;border:1px solid rgba(239,68,68,0.3)}
        .conn-status .dot{width:12px;height:12px;border-radius:50%;animation:pulse 2s infinite}
        .conn-status.on .dot{background:#059669}.conn-status.off .dot{background:#dc2626}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

        .employee-section{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(70px,7vh,130px);padding-bottom:2.5vh;border-bottom:2px solid rgba(91,45,142,0.08);margin-bottom:1.5vh}
        .employee-label{font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1.3rem,2vw,2.8rem);color:var(--accent-purple);margin-bottom:2vh}
        .employee-photo-wrap{width:clamp(130px,13vw,220px);height:clamp(130px,13vw,220px);border-radius:50%;border:5px solid var(--accent-purple);box-shadow:0 8px 30px rgba(91,45,142,0.25);overflow:hidden;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center}
        .employee-photo-wrap img{width:100%;height:100%;object-fit:cover}
        .employee-photo-wrap .placeholder{font-size:clamp(3rem,5vw,6rem);opacity:0.25}
        .employee-name{font-family:'Changa',sans-serif;font-weight:700;font-size:clamp(1.2rem,1.8vw,2.4rem);color:var(--accent-green-dark);margin-top:2vh}

        .quote-section{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:1vh}
        .quote-title{font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1.4rem,2vw,2.8rem);color:var(--accent-green-dark);line-height:1.35;margin-bottom:1vh}
        .quote-author{font-family:'Aref Ruqaa',serif;font-size:clamp(1rem,1.3vw,1.8rem);color:var(--accent-purple);margin-bottom:1vh;padding:0.3rem 1rem;background:rgba(91,45,142,0.08);display:inline-block;border-radius:8px}
        .quote-text{font-family:'Tajawal',sans-serif;font-size:clamp(0.85rem,1vw,1.3rem);line-height:1.8;color:var(--text-dark);max-width:95%;position:relative;padding:1.5vh 1.5vw;background:rgba(255,255,255,0.4);border-radius:14px;border:1px solid rgba(91,45,142,0.06)}
        .quote-text::before{content:'\00AB';font-size:clamp(2rem,2.5vw,3.5rem);color:var(--accent-purple);opacity:0.3;position:absolute;top:-0.2rem;right:0.6rem;font-family:'Aref Ruqaa',serif}

        .date-bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5vh 2vw;background:rgba(255,255,255,0.5);border-top:1px solid rgba(91,45,142,0.08)}
        .date-hijri{font-weight:700;color:var(--accent-purple);font-size:clamp(1rem,1.3vw,1.6rem)}
        .date-hijri-year{font-weight:600;color:var(--text-muted);font-size:clamp(1rem,1.3vw,1.6rem)}
        .date-gregorian{font-weight:600;color:var(--accent-green-dark);font-size:clamp(1rem,1.3vw,1.6rem);letter-spacing:2px;text-transform:uppercase}

        .right-panel{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(0.5rem,0.8vw,1rem);padding:clamp(0.5rem,0.8vw,1rem);overflow:hidden}
        .task-card{background:var(--card-bg);border-radius:18px;padding:clamp(0.8rem,1.2vw,1.5rem);display:flex;flex-direction:column;overflow:hidden;position:relative;border:1px solid rgba(91,45,142,0.06);box-shadow:var(--shadow-card)}
        .task-card::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent-purple),transparent);opacity:0.3;border-radius:18px 18px 0 0}
        .card-header{text-align:center;margin-bottom:clamp(0.4rem,0.8vh,0.8rem);padding-bottom:clamp(0.3rem,0.6vh,0.6rem);border-bottom:3px solid rgba(91,45,142,0.12)}
        .card-title{font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1.2rem,1.8vw,2.5rem);color:var(--accent-purple)}
        .task-list{flex:1;display:flex;flex-direction:column;gap:clamp(0.2rem,0.5vh,0.5rem);overflow-y:auto}
        .task-list::-webkit-scrollbar{width:4px}.task-list::-webkit-scrollbar-thumb{background:rgba(91,45,142,0.25);border-radius:4px}
        .task-item{display:flex;flex-direction:column;gap:clamp(0.15rem,0.3vh,0.3rem);padding:clamp(0.4rem,0.7vw,0.8rem);background:rgba(255,255,255,0.35);border-radius:10px;border-bottom:1px solid rgba(91,45,142,0.05)}
        .task-item.completed{opacity:0.55}.task-item.completed .task-name{text-decoration:line-through}
        .task-top{display:flex;align-items:center;gap:clamp(0.3rem,0.5vw,0.6rem)}
        .task-name{flex:1;font-size:clamp(0.9rem,1.3vw,1.8rem);font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .progress-wrapper{display:flex;align-items:center;gap:clamp(0.3rem,0.4vw,0.5rem);min-width:clamp(70px,7vw,120px);direction:ltr}
        .progress-bar-bg{flex:1;height:clamp(5px,0.5vw,8px);background:var(--progress-bg);border-radius:10px;overflow:hidden}
        .progress-bar-fill{height:100%;border-radius:10px;transition:width 0.6s ease;position:relative}
        .progress-bar-fill.low{background:linear-gradient(90deg,#e74c3c,#e67e22)}.progress-bar-fill.mid{background:linear-gradient(90deg,#f39c12,#e67e22)}.progress-bar-fill.high{background:linear-gradient(90deg,#27ae60,#2ecc71)}.progress-bar-fill.full{background:linear-gradient(90deg,#2ecc71,#27ae60)}
        .progress-bar-fill.full::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}
        @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        .progress-percent{font-size:clamp(0.7rem,0.9vw,1.2rem);font-weight:700;min-width:clamp(24px,2.5vw,40px);text-align:left}
        .progress-percent.low{color:#e74c3c}.progress-percent.mid{color:#f39c12}.progress-percent.high{color:#27ae60}.progress-percent.full{color:#2ecc71}
        .task-meta{display:flex;align-items:center;gap:clamp(0.2rem,0.4vw,0.5rem);flex-wrap:wrap}
        .task-assignee{font-size:clamp(0.65rem,0.85vw,1.1rem);color:var(--accent-purple);background:rgba(91,45,142,0.08);padding:0.15rem clamp(0.3rem,0.5vw,0.7rem);border-radius:50px;display:inline-flex;align-items:center;gap:0.2rem;white-space:nowrap}
        .task-assignee::before{content:'👤';font-size:clamp(0.55rem,0.7vw,0.9rem)}
        .task-status{font-size:clamp(0.6rem,0.85vw,1.1rem);padding:0.15rem clamp(0.4rem,0.6vw,0.8rem);border-radius:8px;font-weight:700;white-space:nowrap}
        .task-status.done{background:#1a6b3c;color:#fff}.task-status.in-progress{background:#c4b44e;color:#1a1a2e}.task-status.delayed{background:#d42e2e;color:#fff}.task-status.paused{background:#c8a2e0;color:#2e0854}.task-status.no-updates{background:#555;color:#fff}
        .empty-state{color:var(--text-muted);text-align:center;font-size:clamp(0.9rem,1.2vw,1.4rem);opacity:0.6;padding:2vh 0}
        .loading-overlay{position:fixed;inset:0;background:rgba(240,250,240,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.5s}
        .loading-overlay.hidden{opacity:0;pointer-events:none}
        .loading-spinner{width:60px;height:60px;border:5px solid rgba(91,45,142,0.15);border-top-color:var(--accent-purple);border-radius:50%;animation:spin 0.8s linear infinite}
        .loading-text{margin-top:1.5rem;font-family:'Changa',sans-serif;color:var(--accent-purple);font-weight:700;font-size:1.5rem}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .task-card{animation:fadeInUp 0.6s ease forwards}
        .task-card:nth-child(1){animation-delay:0.1s}.task-card:nth-child(2){animation-delay:0.15s}.task-card:nth-child(3){animation-delay:0.2s}.task-card:nth-child(4){animation-delay:0.25s}.task-card:nth-child(5){animation-delay:0.3s}.task-card:nth-child(6){animation-delay:0.35s}
        .employee-section{animation:fadeInUp 0.6s ease 0.1s forwards;opacity:0}
        .quote-section{animation:fadeInUp 0.8s ease 0.3s forwards;opacity:0}

        @media(max-width:1024px){.container{grid-template-columns:1fr;height:auto;min-height:100vh}.left-panel{min-height:auto;padding-bottom:5rem}.right-panel{grid-template-columns:1fr 1fr 1fr;height:auto}body{overflow:auto;height:auto}}
        @media(max-width:768px){.left-panel{padding:1.5rem 1.2rem;padding-top:5rem;padding-bottom:5rem}.logo-area{top:1rem;right:1rem;width:80px;height:80px;font-size:0.85rem}.right-panel{grid-template-columns:1fr;padding:1rem;gap:1rem;overflow:visible}.task-card{padding:1rem}.employee-photo-wrap{width:100px;height:100px}.conn-status{top:0.5rem;left:0.5rem;font-size:0.7rem;padding:0.3rem 0.6rem}}
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div class="loading-text">جاري التحميل...</div></div>
    <div class="conn-status off" id="cs"><span class="dot"></span><span id="ct">جاري الاتصال...</span></div>
    <div class="container">
        <div class="left-panel">
            <div class="logo-area"><span>صُنع<br>في<br>أهداف</span></div>
            <div class="employee-section">
                <div class="employee-label" id="employeeLabel">موظف الشهر</div>
                <div class="employee-photo-wrap" id="employeePhotoWrap"><span class="placeholder">👤</span></div>
                <div class="employee-name" id="employeeName"></div>
            </div>
            <div class="quote-section">
                <h1 class="quote-title" id="quoteTitle"></h1>
                <div class="quote-author" id="quoteAuthor"></div>
                <p class="quote-text" id="quoteText"></p>
            </div>
            <div class="date-bar">
                <span class="date-hijri" id="dateHijri"></span>
                <span class="date-hijri-year" id="dateHijriYear"></span>
                <span class="date-gregorian" id="dateGregorian"></span>
            </div>
        </div>
        <div class="right-panel">
            <div class="task-card" id="card-project-management"><div class="card-header"><h2 class="card-title">إدارة المشاريع</h2></div><div class="task-list" id="tasks-project-management"></div></div>
            <div class="task-card" id="card-influencers"><div class="card-header"><h2 class="card-title">المؤثرين</h2></div><div class="task-list" id="tasks-influencers"></div></div>
            <div class="task-card" id="card-public-relations"><div class="card-header"><h2 class="card-title">العلاقات العامة</h2></div><div class="task-list" id="tasks-public-relations"></div></div>
            <div class="task-card" id="card-production"><div class="card-header"><h2 class="card-title">الإنتاج</h2></div><div class="task-list" id="tasks-production"></div></div>
            <div class="task-card" id="card-digital"><div class="card-header"><h2 class="card-title">ديجتال</h2></div><div class="task-list" id="tasks-digital"></div></div>
            <div class="task-card" id="card-korashow"><div class="card-header"><h2 class="card-title">كورة شو</h2></div><div class="task-list" id="tasks-korashow"></div></div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyCiyb2ApY6K3YeNdeC6C8wjmWSeNYTZ03E",authDomain:"taskboard-ahdaf.firebaseapp.com",databaseURL:"https://taskboard-ahdaf-default-rtdb.europe-west1.firebasedatabase.app",projectId:"taskboard-ahdaf",storageBucket:"taskboard-ahdaf.firebasestorage.app",messagingSenderId:"576532765761",appId:"1:576532765761:web:33a0cc6888dd229e81fac0"});
        var db=firebase.database(),dataRef=db.ref('taskboard');
        var statusLabels={'done':'مكتملة','in-progress':'قيد التنفيذ','delayed':'مؤجلة','paused':'متوقفة','no-updates':'لايوجد تحديثات'};

        function gpc(p){if(p>=100)return'full';if(p>=60)return'high';if(p>=30)return'mid';return'low'}
        function setAutoDate(){
            var now=new Date();
            var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
            document.getElementById('dateGregorian').textContent=days[now.getDay()]+' - '+now.getDate()+' - '+months[now.getMonth()]+' - '+now.getFullYear();
            try{var h=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(now);document.getElementById('dateHijri').textContent=h;document.getElementById('dateHijriYear').textContent=''}catch(e){document.getElementById('dateHijri').textContent='';document.getElementById('dateHijriYear').textContent=''}
        }

        function render(data){
            if(!data)return;
            var emp=data.employee||{};
            document.getElementById('employeeLabel').textContent=emp.label||'موظف الشهر';
            document.getElementById('employeeName').textContent=emp.name||'';
            var pw=document.getElementById('employeePhotoWrap');
            if(emp.photoData){pw.innerHTML='<img src="'+emp.photoData+'" alt="">'}
            else if(emp.photoUrl){pw.innerHTML='<img src="'+emp.photoUrl+'" alt="">'}
            else{pw.innerHTML='<span class="placeholder">👤</span>'}

            var keys=Object.keys(data.sections||{});
            for(var k=0;k<keys.length;k++){
                var key=keys[k],c=document.getElementById('tasks-'+key);
                if(!c)continue;
                var s=data.sections[key];c.innerHTML='';
                var card=document.getElementById('card-'+key);
                if(card)card.querySelector('.card-title').textContent=s.title;
                var tasks=s.tasks||[];
                if(!tasks.length){c.innerHTML='<div class="empty-state">لا توجد مهام</div>';continue}
                for(var i=0;i<tasks.length;i++){
                    var t=tasks[i];if(typeof t==='string')t={name:t,progress:0,assignee:'',status:''};
                    var nm=t.name,pr=t.progress||0,cl=gpc(pr),asgn=t.assignee||'',st=t.status||'';
                    var d=document.createElement('div');d.className='task-item'+(st==='done'?' completed':'');
                    var meta='';if(asgn||st){meta='<div class="task-meta">';if(asgn)meta+='<span class="task-assignee">'+asgn+'</span>';if(st&&statusLabels[st])meta+='<span class="task-status '+st+'">'+statusLabels[st]+'</span>';meta+='</div>'}
                    d.innerHTML='<div class="task-top"><span class="task-name">'+nm+'</span><div class="progress-wrapper"><div class="progress-bar-bg"><div class="progress-bar-fill '+cl+'" style="width:'+pr+'%"></div></div><span class="progress-percent '+cl+'">'+pr+'%</span></div></div>'+meta;
                    c.appendChild(d);
                }
            }
            if(data.quote){document.getElementById('quoteTitle').textContent=data.quote.title||'';document.getElementById('quoteAuthor').textContent=data.quote.author||'';document.getElementById('quoteText').textContent=data.quote.text||''}
            setAutoDate();
            var fs=data.fontSizes||{};
            if(fs.quoteTitle)document.getElementById('quoteTitle').style.fontSize=fs.quoteTitle+'px';
            if(fs.quoteAuthor)document.getElementById('quoteAuthor').style.fontSize=fs.quoteAuthor+'px';
            if(fs.quoteText)document.getElementById('quoteText').style.fontSize=fs.quoteText+'px';
            if(fs.sectionTitle)document.querySelectorAll('.card-title').forEach(function(el){el.style.fontSize=fs.sectionTitle+'px'});
            if(fs.taskName)document.querySelectorAll('.task-name').forEach(function(el){el.style.fontSize=fs.taskName+'px'});
            if(fs.date){document.getElementById('dateHijri').style.fontSize=fs.date+'px';document.getElementById('dateHijriYear').style.fontSize=fs.date+'px';document.getElementById('dateGregorian').style.fontSize=fs.date+'px'}
            if(fs.meta){document.querySelectorAll('.task-assignee').forEach(function(el){el.style.fontSize=fs.meta+'px'});document.querySelectorAll('.task-status').forEach(function(el){el.style.fontSize=fs.meta+'px'})}
            if(fs.progress)document.querySelectorAll('.progress-percent').forEach(function(el){el.style.fontSize=fs.progress+'px'});
            // Layout
            var lay=data.layout||{photoSize:160,empLabel:24,empName:22,empRatio:50,quoteRatio:50};
            var pw=document.getElementById('employeePhotoWrap');
            pw.style.width=lay.photoSize+'px';pw.style.height=lay.photoSize+'px';
            document.getElementById('employeeLabel').style.fontSize=lay.empLabel+'px';
            document.getElementById('employeeName').style.fontSize=lay.empName+'px';
            var empSec=document.querySelector('.employee-section');
            var quoteSec=document.querySelector('.quote-section');
            if(empSec&&quoteSec){empSec.style.flex='0 0 '+lay.empRatio+'%';quoteSec.style.flex='0 0 '+lay.quoteRatio+'%'}
        }
        db.ref('.info/connected').on('value',function(s){var e=document.getElementById('cs'),t=document.getElementById('ct');if(s.val()){e.className='conn-status on';t.textContent='متصل'}else{e.className='conn-status off';t.textContent='غير متصل'}});
        var fl=true;
        dataRef.on('value',function(snap){var d=snap.val();if(d){if(!d.sections)d.sections={};if(!d.sections['digital'])d.sections['digital']={title:'ديجتال',tasks:[]};if(!d.sections['korashow'])d.sections['korashow']={title:'كورة شو',tasks:[]};if(!d.employee)d.employee={label:'موظف الشهر',name:'',photoData:''};render(d)}else{render(null)}if(fl){fl=false;setTimeout(function(){document.getElementById('loadingOverlay').classList.add('hidden')},400)}});
        setTimeout(function(){if(fl){document.getElementById('loadingOverlay').classList.add('hidden')}},5000);
    </script>
</body>
</html>
